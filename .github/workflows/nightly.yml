name: Nightly full suite

on:
  schedule:
    # 02:30 UTC every weekday.
    - cron: '30 2 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  test:
    name: Nightly (shard ${{ matrix.shard }}/4)
    # Pinned for the same reason as the PR workflow: this run includes the
    # visual project, and the committed Linux baselines were generated inside
    # mcr.microsoft.com/playwright:v1.62.1-noble (Ubuntu 24.04). Letting this
    # float on ubuntu-latest would fail every visual test the day GitHub
    # rolls the image forward, with no change on our side.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Unlike the PR workflow, the nightly run covers every browser.
      - run: npx playwright install --with-deps

      - name: Run the full suite
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  report:
    name: Merge nightly reports
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          pattern: nightly-blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-report
          path: playwright-report/
          retention-days: 30
