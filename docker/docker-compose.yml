# Without this the project name is derived from the directory holding this
# file, i.e. "docker", which collides with every other project laid out the
# same way.
name: playwright-template

services:
  tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Chromium needs a large /dev/shm or it crashes on some hosts. `ipc: host`
    # is what the Playwright docs recommend; `shm_size: 1gb` is the fallback if
    # your host disallows host IPC namespaces.
    ipc: host
    # Surfaces browser zombie processes to PID 1 so an interrupted run does not
    # leave orphaned Chromium processes behind.
    init: true
    environment:
      CI: 'true'
    volumes:
      # Mount the repo so reports and updated baselines land on the host.
      - ..:/work
      # Anonymous volume: without it the bind mount above shadows the image's
      # /work/node_modules with the host's, which on Windows/macOS means
      # foreign-platform binaries and an immediately broken run. Docker seeds
      # this volume from the image layer, so the container keeps its own
      # Linux-built modules. `docker compose run --rm` discards it afterwards.
      - /work/node_modules
    command: npm test
